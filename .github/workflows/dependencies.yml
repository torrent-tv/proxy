name: Dependencies

# Daily: update dependencies within the ranges in package.json, apply non-breaking
# security fixes, run the checks, push to main and start the main workflow,
# which releases the update when it changes what is published.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: dependencies

permissions:
  contents: write
  actions: write

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The same packet timing reference the main workflow's checks read: the
      # installer's Linux ffprobe crashes on MPEG-TS packet inspection, and
      # without this the update's own checks failed every day from 2026-10-06.
      - name: Install the packet timing reference
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - uses: torrent-tv/.github/actions/update-dependencies@main
        env:
          FFPROBE_BIN: /usr/bin/ffprobe
        with:
          github-token: ${{ github.token }}
          # npm users install the proxy from the ranges in package.json; the lock file
          # is not published, so an update of the lock file alone releases nothing.
          ships-lockfile: "false"
          extra-check: node scripts/check-tests-start-no-torrent.mjs
