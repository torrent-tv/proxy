name: Main

# Every push to main runs the checks and then the release. The release publishes
# @torrent-tv/proxy to npm when the Conventional Commits since the last tag ask for
# one, and then points the Home Assistant add-on at it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Release step
        type: choice
        options: [auto, patch, minor]
        default: auto

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    # A newer push to a pull request makes its older checks pointless; every push to
    # main gets a group of its own, so no check of main is ever replaced.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || format('checks-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: torrent-tv/.github/actions/checks@main
        with:
          changelog: CHANGELOG.md
          version-file: package.json
          # No check may start a real torrent; this is the static half of that rule.
          extra-check: node scripts/check-tests-start-no-torrent.mjs

  release:
    name: Release
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Every release runs, one at a time, in the order the runs reach the queue; the
    # version comparisons below make the order of arrival harmless.
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - id: release
        uses: torrent-tv/.github/actions/release-prepare@main
        with:
          version-files: package.json,package-lock.json
          changelog: CHANGELOG.md
          bump: ${{ inputs.bump || 'auto' }}

      - name: Publish to npm
        if: steps.release.outputs.released == 'true' && steps.release.outputs.already != 'true'
        env:
          # Empty once npm trusted publishing is enabled; npm then authenticates with
          # the workflow's OIDC token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install --global npm@11
          npm publish --provenance --access public

      - if: steps.release.outputs.released == 'true'
        uses: torrent-tv/.github/actions/release-finish@main
        with:
          tag: ${{ steps.release.outputs.tag }}
          notes-file: ${{ steps.release.outputs.notes-file }}
          github-token: ${{ github.token }}

      - name: Token for the add-on only
        id: addon-token
        if: steps.release.outputs.released == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: torrent-tv
          repositories: ha-addon
          permission-contents: write
          permission-actions: read

      - if: steps.release.outputs.released == 'true'
        uses: torrent-tv/.github/actions/addon-install-proxy@main
        with:
          github-token: ${{ steps.addon-token.outputs.token }}
          proxy-version: ${{ steps.release.outputs.version }}
          bump: ${{ steps.release.outputs.bump }}
          notes-file: ${{ steps.release.outputs.notes-file }}
          task: "#ttv-91"
