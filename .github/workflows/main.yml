name: Main

# Every push to main runs the checks and then the release. The release publishes
# @torrent-tv/proxy to npm when the Conventional Commits since the last tag ask for
# one, and then points the Home Assistant add-on at it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Release step
        type: choice
        options: [auto, patch, minor]
        default: auto

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: torrent-tv/.github/actions/checks@main
        with:
          changelog: CHANGELOG.md
          version-file: package.json
          # No check may start a real torrent; this is the static half of that rule.
          extra-check: node scripts/check-tests-start-no-torrent.mjs

  release:
    name: Release
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - id: release
        uses: torrent-tv/.github/actions/release-prepare@main
        with:
          version-files: package.json,package-lock.json
          changelog: CHANGELOG.md
          bump: ${{ inputs.bump || 'auto' }}

      - name: Publish to npm
        if: steps.release.outputs.released == 'true'
        env:
          # Empty once npm trusted publishing is enabled; npm then authenticates with
          # the workflow's OIDC token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install --global npm@11
          npm publish --provenance --access public

      - if: steps.release.outputs.released == 'true'
        uses: torrent-tv/.github/actions/release-finish@main
        with:
          tag: ${{ steps.release.outputs.tag }}
          notes-file: ${{ steps.release.outputs.notes-file }}
          github-token: ${{ github.token }}

      - name: Check out the add-on
        if: steps.release.outputs.released == 'true'
        uses: actions/checkout@v7
        with:
          repository: torrent-tv/ha-addon
          ssh-key: ${{ secrets.ADDON_DEPLOY_KEY }}
          path: ha-addon

      - if: steps.release.outputs.released == 'true'
        uses: torrent-tv/.github/actions/addon-install-proxy@main
        with:
          addon-path: ha-addon
          proxy-version: ${{ steps.release.outputs.version }}
          bump: ${{ steps.release.outputs.bump }}
          notes-file: ${{ steps.release.outputs.notes-file }}
