name: Main

# Every push to main runs the checks and then the release. The release publishes
# @torrent-tv/proxy to npm when the Conventional Commits since the last tag ask for
# one, tags the merged commit (no release commit is made), and then points the Home
# Assistant add-on at it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Least release step (a feat still releases minor)
        type: choice
        options: [auto, patch, minor]
        default: auto

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-26.04
    # The commit check lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    # A newer push to a pull request makes its older checks pointless; every push to
    # main gets a group of its own, so no check of main is ever replaced.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || format('checks-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # One step per check, so the run shows which check ran and which one failed.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 24
          cache: npm
      # The installer's Linux ffprobe crashes on MPEG-TS packet inspection.
      # The runner tries this stalled mirror before archive.ubuntu.com.
      - name: Skip the Azure Ubuntu mirror
        run: sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
      - name: Update the Ubuntu package index
        run: |
          mkdir -p "$RUNNER_TEMP/apt-archives"
          sudo timeout --signal=TERM --kill-after=10s 120s apt-get update
      - name: Resolve packet timing package versions
        id: packet-timing-packages
        run: node scripts/packet-timing-reference-cache-key.mjs
      - name: Restore packet timing package cache
        id: packet-timing-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ runner.arch }}-${{ steps.packet-timing-packages.outputs.key }}
          restore-keys: |
            ${{ runner.arch }}-ubuntu-26.04-ffmpeg-
      - name: Install the packet timing reference
        env:
          CACHE_HIT: ${{ steps.packet-timing-cache.outputs.cache-hit }}
        run: |
          echo "::notice::Packet timing package cache: ${CACHE_HIT:-miss}"
          sudo timeout --signal=TERM --kill-after=10s 180s apt-get \
            -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" \
            -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            install --no-install-recommends -y ffmpeg
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" autoclean
          sudo rm -rf "$RUNNER_TEMP/apt-archives/partial" "$RUNNER_TEMP/apt-archives/lock"
      - name: Save packet timing package cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ runner.arch }}-${{ steps.packet-timing-packages.outputs.key }}
      - name: Commit messages follow Conventional Commits
        uses: wagoid/commitlint-github-action@v6.2.1
      - name: No secrets in commits
        uses: torrent-tv/workflows/actions/check-secrets@main
      - name: Branch name names a task
        if: github.event_name == 'pull_request'
        run: '[[ "$GITHUB_HEAD_REF" =~ ^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)/ttv-[1-9][0-9]*-[a-z0-9][a-z0-9.-]*$ ]]'
      # actionlint 1.7.12 predates three documented things; drop each ignore once
      # actionlint knows it: the `queue` key of `concurrency` (queue: max keeps every
      # pending run), the `ubuntu-26.04` runner label, and the `client-id` input of
      # actions/create-github-app-token, which replaces `app-id`.
      # The runner passes `args` to docker without shell quoting, so a space inside a
      # pattern is written `\s` and a quote `.` (each pattern is a regular expression).
      - name: Workflows are valid
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: >-
            -color
            -ignore unexpected\skey\s.queue.\sfor\s.concurrency.\ssection
            -ignore label\s.ubuntu-26\.04.\sis\sunknown
            -ignore input\s.client-id.\sis\snot\sdefined\sin\saction\s.actions/create-github-app-token@
            -ignore missing\sinput\s.app-id.\swhich\sis\srequired\sby\saction\s.actions/create-github-app-token@
      - name: Pull request adds a changeset
        uses: torrent-tv/workflows/actions/check-changesets@main
      # npm ci fetches three things outside the npm registry, with no retry of its
      # own worth the name: node-datachannel's binary and ffmpeg-static's ffmpeg
      # from GitHub releases, and node's headers from nodejs.org to compile
      # utp-native. A GitHub 504 failed every pull request on 2026-11-08
      # (torrent-tv/meta#338). With an unchanged lockfile they come from here.
      - name: Restore native download cache
        id: native-downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.npm/_prebuilds
            ~/.cache/node-gyp
            ~/.cache/torrent-tv/ffmpeg-static
          key: native-downloads-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      # ffmpeg-static skips its download when FFMPEG_BIN names a file. npm ci
      # empties node_modules first, so the cached ffmpeg is copied in afterwards,
      # and a freshly downloaded one is copied out for the cache.
      - name: Install dependencies
        env:
          CACHE_HIT: ${{ steps.native-downloads.outputs.cache-hit }}
        run: |
          echo "::notice::Native download cache: ${CACHE_HIT:-miss}"
          ffmpeg_cache="$HOME/.cache/torrent-tv/ffmpeg-static/ffmpeg"
          if [ -f "$ffmpeg_cache" ]; then export FFMPEG_BIN="$ffmpeg_cache"; fi
          node scripts/retry.mjs 3 20 npm ci --foreground-scripts
          if [ -n "${FFMPEG_BIN:-}" ]; then
            cp "$FFMPEG_BIN" node_modules/ffmpeg-static/ffmpeg
          else
            mkdir -p "$(dirname "$ffmpeg_cache")"
            cp node_modules/ffmpeg-static/ffmpeg "$ffmpeg_cache"
          fi
      - name: Save native download cache
        if: steps.native-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.npm/_prebuilds
            ~/.cache/node-gyp
            ~/.cache/torrent-tv/ffmpeg-static
          key: native-downloads-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      # No check may start a real torrent; this is the static half of that rule.
      - name: Tests start no real torrent
        run: node scripts/check-tests-start-no-torrent.mjs
      - name: Lint and tests
        env:
          FFPROBE_BIN: /usr/bin/ffprobe
        run: npm test

  # The README offers the Dockerfile as a way to run the proxy; nothing built it,
  # and it stopped working unnoticed. The image checks itself in its final stage
  # (`--help`), so building it is the whole check.
  build:
    name: Image build
    needs: checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the image for amd64
        run: docker build -t torrent-tv-proxy .

  release:
    name: Release
    needs: [checks, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: production
    # Every release runs, one at a time, in the order the runs reach the queue. A later
    # run sees the earlier tag and releases what came after it; a run whose commit a
    # tag already holds only finishes what is missing.
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The version is the newest v* tag plus the step the commits ask for; it is
      # written into package.json and package-lock.json of this workspace only.
      - id: release
        uses: torrent-tv/workflows/actions/release-plan@main
        with:
          version-files: package.json,package-lock.json
          bump: ${{ inputs.bump || 'auto' }}

      - name: Publish to npm
        if: steps.release.outputs.released == 'true' && steps.release.outputs.already != 'true'
        # npm trusted publishing (npmjs.com: torrent-tv/proxy, main.yml, environment
        # production) authenticates this step with the workflow's OIDC token; no npm
        # token is stored.
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm install --global npm@11
          # A re-run after a publication whose tag push failed finds the version published
          # from this very commit (npm records it as gitHead) and only tags it.
          published=$(npm view "@torrent-tv/proxy@$VERSION" gitHead 2>/dev/null || true)
          if [ -z "$published" ]; then
            npm publish --provenance --access public
          elif [ "$published" = "$(git rev-parse HEAD)" ]; then
            echo "::notice::@torrent-tv/proxy@$VERSION is already published from this commit; only the tag is pushed"
          else
            echo "::error::@torrent-tv/proxy@$VERSION is published from $published but v$VERSION is not tagged; re-run the release of $published first"
            exit 1
          fi

      - if: steps.release.outputs.released == 'true'
        uses: torrent-tv/workflows/actions/release-tag@main
        with:
          tag: ${{ steps.release.outputs.tag }}
          notes-file: ${{ steps.release.outputs.notes-file }}
          github-token: ${{ github.token }}

      # Unchanged until torrent-tv/meta#336 step 3 replaces them with a dispatch.
      - name: Token for the add-on only
        id: addon-token
        if: steps.release.outputs.released == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: torrent-tv
          repositories: ha-addon
          permission-contents: write
          permission-actions: read

      - if: steps.release.outputs.released == 'true'
        uses: torrent-tv/workflows/actions/addon-install-proxy@main
        with:
          github-token: ${{ steps.addon-token.outputs.token }}
          proxy-version: ${{ steps.release.outputs.version }}
          bump: ${{ steps.release.outputs.bump }}
          notes-file: ${{ steps.release.outputs.notes-file }}
          task: "#ttv-387"
